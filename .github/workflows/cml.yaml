# Q1 (e) - Reproduce the DVC experiment on every pull request and post a
# metrics report (metrics diff, params diff, confusion matrix) as a PR comment.
name: CML experiment report

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "params.yaml"
      - "dvc.yaml"
      - "dvc.lock"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/cml.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reproduce-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so we can diff against main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get data (DVC remote, or regenerate the identical file)
        run: |
          # A local DVC remote is not reachable from GitHub runners. If you set up a
          # cloud remote (S3/GDrive/DagsHub), `dvc pull` succeeds and is used instead.
          dvc pull data/raw/iris.csv.dvc || python src/get_data.py
          dvc status data/raw/iris.csv.dvc

      - name: Reproduce pipeline
        run: |
          dvc repro
          cat metrics.json

      - name: Build CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main:main || git fetch origin main

          echo "## 🧪 Experiment report (commit ${GITHUB_SHA::7})" > report.md
          echo "" >> report.md
          echo "### Metrics: this PR vs \`main\`" >> report.md
          dvc metrics diff main --md --all >> report.md
          echo "" >> report.md
          echo "### Parameters changed vs \`main\`" >> report.md
          dvc params diff main --md >> report.md || echo "_No parameter changes._" >> report.md
          echo "" >> report.md
          echo "### Confusion matrix" >> report.md
          echo '![confusion matrix](./plots/confusion_matrix.png)' >> report.md

          cml comment update report.md
